name: Build Celeste iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 1. Install dependencies required for the project
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Installs the decompiler required by build.sh
    - name: Install Tools via Dotnet
      run: |
        dotnet tool install -g ilspycmd --version 8.0.0.7246-preview3

    # 2. Extract your Linux game archive into the exact folder the script looks for
    # NOTE: This assumes your file is named 'celeste-linux.tar.gz' and is sitting in the root folder.
    # Change the file name below if yours is named differently.
     Tar -xzf celeste-linux.tar.gz -C orig_files/ || tar -xzf assets/celeste-linux.tar.gz -C orig_files/

    # 3. Disable code signing and force-run the interactive build script
    - name: Patch and Compile Celeste
      run: |
        export CODE_SIGNING_ALLOWED=NO
        export CODE_SIGNING_REQUIRED=NO
        export CODE_SIGN_IDENTITY=""
        export PROVISIONING_PROFILE_SPECIFIER=""
        
        chmod +x build.sh
        
        # 'yes ""' automatically presses Enter for you whenever the script pauses
        yes "" | ./build.sh

    # 4. Save and export the final .ipa file to GitHub
    - name: Upload Unsigned IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Celeste-Unsigned-IPA
        path: "*.ipa"
